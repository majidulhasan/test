        body {

          overflow-x: hidden;
          width: 100%;
          margin: 0;
          padding: 0;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes progress { 0% { transform: translateX(-100%); } 50% { transform: translateX(0); } 100% { transform: translateX(100%); } }
        .animate-progress { animation: progress 1s infinite linear; }
        
        /* Smooth scale in animation for modals */
        .scale-in-center { animation: scale-in-center 0.3s cubic-bezier(0.250, 0.460, 0.450, 0.940) both; }
        @keyframes scale-in-center {
          0% { transform: scale(0.9); opacity: 0; }
          100% { transform: scale(1); opacity: 1; }
        }
    </style>
